name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site lives at https://<user>.github.io/<repo>/ so the base href must be /<repo>/
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages has no SPA fallback: serving index.html as 404.html makes
      # a reload on /movie/123 or /wishlist still load the app
      - run: cp dist/movie-app/browser/index.html dist/movie-app/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/movie-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
